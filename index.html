<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আর্থিক লেনদেন এন্ট্রি</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%); min-height: 100vh; color: #1e293b; padding: 40px 16px; display: flex; align-items: flex-start; justify-content: center; }
        .container { width: 100%; max-width: 680px; margin: 0 auto; background: rgba(255, 255, 255, 0.97); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10); border: 1px solid rgba(226, 232, 240, 0.8); }
        .header { background: linear-gradient(135deg, #4f46e5, #6366f1); padding: 32px 36px; color: white; position: relative; overflow: hidden; min-height: 120px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; position: relative; z-index: 1; }
        .title-section { display: flex; align-items: center; gap: 16px; }
        .title-icon { width: 52px; height: 52px; border-radius: 16px; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid rgba(255, 255, 255, 0.3); flex-shrink: 0; }
        .title-section h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .title-section p { font-size: 13px; margin-top: 4px; color: rgba(255, 255, 255, 0.85); }
        .btn-dashboard { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 12px; background: rgba(255, 255, 255, 0.15); color: white; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.25); }
        .form-area { padding: 28px 30px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 22px; text-transform: uppercase; }
        .section-title::before { content: ""; width: 4px; height: 16px; background: #6366f1; border-radius: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .required { color: #ef4444; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #64748b; pointer-events: none; z-index: 2; }
        input, select, textarea { width: 100%; height: 46px; padding: 0 14px 0 40px; border: 1px solid #d7dee8; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1e293b; background: #f8fafc; outline: none; transition: all 0.2s ease; }
        textarea { height: 80px; padding: 12px 14px 12px 40px; resize: none; }
        select { cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,0.12); }
        input:disabled, select:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .amount-wrapper input { padding-left: 42px; padding-right: 60px; font-weight: 600; }
        .currency { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: #64748b; background: #e2e8f0; padding: 4px 7px; border-radius: 5px; }
        .divider { height: 1px; background: #e2e8f0; margin: 26px 0 22px; }
        button[type="submit"] { width: 100%; height: 49px; margin-top: 5px; border: none; border-radius: 11px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
        button[type="submit"]:disabled { background: #94a3b8; cursor: not-allowed; }
        #statusMsg { display: none; text-align: center; margin-top: 16px; padding: 11px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; }
        #statusMsg.success { display: block; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; }
        #statusMsg.error { display: block; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
        #statusMsg.loading { display: block; color: #0369a1; background: #f0f9ff; border: 1px solid #bae6fd; }
        .footer-note { text-align: center; padding: 0 30px 22px; font-size: 11px; color: #94a3b8; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-top">
            <div class="title-section">
                <div class="title-icon">💰</div>
                <div>
                    <h1>আর্থিক লেনদেন এন্ট্রি</h1>
                    <p>আপনার আয়, ব্যয় ও বিনিয়োগ রেকর্ড করুন</p>
                </div>
            </div>
            <a href="dashboard.html" class="btn-dashboard">📊 <span>ড্যাশবোর্ড</span></a>
        </div>
    </div>

    <div class="form-area">
        <div class="section-title">লেনদেনের বিবরণ</div>
        <form id="financeForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">📅 তারিখ <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">📅</span>
                        <input type="text" id="date" name="date" placeholder="দিন/মাস/বছর" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="transactionType">🔄 লেনদেনের ধরন <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">↔️</span>
                        <select id="transactionType" name="transactionType" onchange="updateCategories()" required>
                            <option value="">লোড হচ্ছে...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">🗂️ প্রধান খাত <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">📂</span>
                        <select id="category" name="category" onchange="updateSubCategories()" required disabled>
                            <option value="">আগে ধরন নির্বাচন করুন</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="subCategory">📁 উপ-খাত <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🗃️</span>
                        <select id="subCategory" name="subCategory" required disabled>
                            <option value="">আগে প্রধান খাত নির্বাচন করুন</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="fromAccount">💳 উৎস অ্যাকাউন্ট <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">💳</span>
                        <select id="fromAccount" name="fromAccount" onchange="toggleCardNetwork()" required>
                            <option value="">লোড হচ্ছে...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="toAccountGroup" style="display: none;">
                    <label for="toAccount">🏦 গন্তব্য অ্যাকাউন্ট <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🏦</span>
                        <select id="toAccount" name="toAccount">
                            <option value="">অ্যাকাউন্ট নির্বাচন করুন</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="cardNetworkGroup" style="display: none;">
                    <label for="cardNetwork">💳 কার্ড নেটওয়ার্ক <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🌐</span>
                        <select id="cardNetwork" name="cardNetwork">
                            <option value="">কার্ড নির্বাচন করুন</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="amount">💵 পরিমাণ <span class="required">*</span></label>
                    <div class="input-wrapper amount-wrapper">
                        <span class="input-icon">৳</span>
                        <input type="number" id="amount" name="amount" min="0" step="any" placeholder="০.০০" required>
                        <span class="currency">টাকা</span>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="notes">📝 বিবরণ</label>
                    <div class="input-wrapper">
                        <span class="input-icon" style="top: 20px;">📝</span>
                        <textarea id="notes" name="notes" placeholder="লেনদেনের বিবরণ লিখুন (ঐচ্ছিক)"></textarea>
                    </div>
                </div>
            </div>
            <div class="divider"></div>
            <button type="submit" id="submitBtn">💾 লেনদেন সেভ করুন</button>
        </form>
        <p id="statusMsg"></p>
    </div>
    <div class="footer-note">আপনার সব লেনদেন নিরাপদে গুগল শিটে সেভ হবে।</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // ========== CONFIGURATION ==========
    // আপনার Apps Script এর Web App URL এখানে বসান
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyNkZhEYgVZPS4IGJUT4fbESwStiRFe_XWusBVZmnrxkIoXsoSiJJZuBW6ZXBngZwv1/exec';
    // ===================================

    let formattedBackendDate = "";
    let masterData = { types: [], accounts: [], cardNetworks: [], dataMap: [] };

    function setBackendDate(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        formattedBackendDate = `${year}-${month}-${day}`;
    }

    const fp = flatpickr("#date", {
        dateFormat: "d/m/Y",
        defaultDate: "today",
        allowInput: true,
        onReady: function(selectedDates) { if (selectedDates[0]) setBackendDate(selectedDates[0]); },
        onChange: function(selectedDates) { if (selectedDates[0]) setBackendDate(selectedDates[0]); }
    });

    // ========== MASTER LIST লোড করা (fetch API দিয়ে) ==========
    window.onload = function() {
        // Apps Script থেকে ডেটা আনার জন্য fetch ব্যবহার করা হচ্ছে
        fetch(scriptURL + '?action=getMasterData')
            .then(response => response.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                loadMasterData(data);
            })
            .catch(err => {
                console.error("Error loading master data:", err);
                alert("ড্রপডাউন ডেটা লোড করতে সমস্যা হয়েছে। দয়া করে পেজটি রিফ্রেশ করুন।");
            });
    };

    function loadMasterData(data) {
        masterData = data;
        
        // ১. ধরন (Type) ড্রপডাউন পূরণ করা
        const typeSelect = document.getElementById("transactionType");
        typeSelect.innerHTML = '<option value="">ধরন নির্বাচন করুন</option>';
        data.types.forEach(type => {
            const opt = document.createElement("option");
            opt.value = type;
            opt.textContent = type;
            typeSelect.appendChild(opt);
        });

        // ২. উৎস ও গন্তব্য অ্যাকাউন্ট ড্রপডাউন পূরণ করা
        const fromSelect = document.getElementById("fromAccount");
        const toSelect = document.getElementById("toAccount");
        fromSelect.innerHTML = '<option value="">অ্যাকাউন্ট নির্বাচন করুন</option>';
        toSelect.innerHTML = '<option value="">অ্যাকাউন্ট নির্বাচন করুন</option>';
        
        data.accounts.forEach(acc => {
            const opt1 = document.createElement("option");
            opt1.value = acc; opt1.textContent = acc;
            fromSelect.appendChild(opt1);

            const opt2 = document.createElement("option");
            opt2.value = acc; opt2.textContent = acc;
            toSelect.appendChild(opt2);
        });

        // ৩. কার্ড নেটওয়ার্ক ড্রপডাউন পূরণ করা
        const cardSelect = document.getElementById("cardNetwork");
        cardSelect.innerHTML = '<option value="">কার্ড নির্বাচন করুন</option>';
        data.cardNetworks.forEach(card => {
            const opt = document.createElement("option");
            opt.value = card; opt.textContent = card;
            cardSelect.appendChild(opt);
        });
    }

    // ========== ড্রপডাউন লজিক ==========
    function updateCategories() {
        const type = document.getElementById("transactionType").value;
        const catSelect = document.getElementById("category");
        const subSelect = document.getElementById("subCategory");
        const toGroup = document.getElementById("toAccountGroup");

        catSelect.innerHTML = '<option value="">প্রধান খাত নির্বাচন করুন</option>';
        subSelect.innerHTML = '<option value="">আগে প্রধান খাত নির্বাচন করুন</option>';
        subSelect.disabled = true;
        
        toGroup.style.display = (type === "স্থানান্তর" || type === "ঋণ") ? "flex" : "none";

        if (!type) {
            catSelect.disabled = true;
            return;
        }
        catSelect.disabled = false;
        
        const filteredCats = [...new Set(masterData.dataMap.filter(item => item.type === type).map(item => item.category))];
        filteredCats.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            catSelect.appendChild(opt);
        });
    }

    function updateSubCategories() {
        const type = document.getElementById("transactionType").value;
        const cat = document.getElementById("category").value;
        const subSelect = document.getElementById("subCategory");
        
        subSelect.innerHTML = '<option value="">উপ-খাত নির্বাচন করুন</option>';
        
        if (!cat) {
            subSelect.disabled = true;
            return;
        }
        subSelect.disabled = false;
        
        const filteredSubs = masterData.dataMap.filter(item => item.type === type && item.category === cat).map(item => item.subCategory);
        filteredSubs.forEach(sub => {
            const opt = document.createElement("option");
            opt.value = sub;
            opt.textContent = sub;
            subSelect.appendChild(opt);
        });
    }

    function toggleCardNetwork() {
        const fromAccount = document.getElementById("fromAccount").value;
        const cardGroup = document.getElementById("cardNetworkGroup");
        if (fromAccount.includes("Card")) {
            cardGroup.style.display = "flex";
        } else {
            cardGroup.style.display = "none";
        }
    }

    // ========== ফর্ম সাবমিট ==========
    const form = document.getElementById('financeForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ সেভ হচ্ছে...';
        statusMsg.className = "loading";
        statusMsg.innerText = "গুগল শিটে ডেটা সেভ করা হচ্ছে...";
        statusMsg.style.display = "block";

        const formData = new FormData(form);
        formData.set('date', formattedBackendDate);

        fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'success') {
                statusMsg.className = "success";
                statusMsg.innerText = "✓ লেনদেন সফলভাবে সেভ হয়েছে!";
                form.reset();
                fp.setDate(new Date());
                setBackendDate(new Date());
                document.getElementById("category").disabled = true;
                document.getElementById("category").innerHTML = '<option value="">আগে ধরন নির্বাচন করুন</option>';
                document.getElementById("subCategory").disabled = true;
                document.getElementById("subCategory").innerHTML = '<option value="">আগে প্রধান খাত নির্বাচন করুন</option>';
                document.getElementById("toAccountGroup").style.display = "none";
                document.getElementById("cardNetworkGroup").style.display = "none";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '💾 লেনদেন সেভ করুন';
                setTimeout(() => { statusMsg.className = ""; statusMsg.style.display = "none"; }, 4000);
            } else {
                throw new Error(data.error || 'Server returned error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.className = "error";
            statusMsg.innerText = "✕ ডেটা সেভ করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
            statusMsg.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 লেনদেন সেভ করুন';
        });
    });
</script>

</body>
</html>
