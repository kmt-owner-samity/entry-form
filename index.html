<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9edf5">
<title>আমার হিসাব</title>
<!-- ৪ সেকেন্ডের মধ্যে জাভাস্ক্রিপ্ট না চললেও যেন অ্যাপ খোলে -->
<noscript><meta http-equiv="refresh" content="1;url=home.html"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eef1f9;--bg2:#dfe5ff;--ink:#101a33;--mute:#6b7592;--blue:#3347ff;--violet:#8b5cf6;--mint:#12b886;--coral:#ff5c7a;--amber:#ffa62b;--dur:3.6s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;
  color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2) 0%,var(--bg1) 55%,#e9edf5 100%);
  display:grid;place-items:center;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;
}
/* পেছনের নরম আলোর বুদবুদ */
.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.g1{width:260px;height:260px;background:#b9c4ff;top:-70px;left:-60px;animation:drift 9s ease-in-out infinite alternate}
.g2{width:240px;height:240px;background:#d9c8ff;bottom:-60px;right:-50px;animation:drift 11s ease-in-out infinite alternate-reverse}
.g3{width:160px;height:160px;background:#b8f0dc;bottom:18%;left:-40px;opacity:.4;animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,-22px)}}

.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}

/* লোগো */
.logo{position:relative;width:132px;height:132px;display:grid;place-items:center;animation:pop .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.logo .tile{position:absolute;inset:14px;border-radius:30px;background:linear-gradient(135deg,#2338e8,#8b5cf6);box-shadow:0 18px 40px rgba(51,71,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(51,71,255,.14);stroke-width:5}
.ring{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352}
.r1{stroke:var(--mint);animation:draw 1.5s .5s ease-out forwards;--to:210}
.r2{stroke:var(--amber);animation:draw 1.5s .8s ease-out forwards;--to:290;stroke-dasharray:352;transform-origin:center;transform:rotate(130deg)}
.r3{stroke:var(--coral);animation:draw 1.2s 1.1s ease-out forwards;--to:318;transform-origin:center;transform:rotate(235deg)}
@keyframes draw{to{stroke-dashoffset:var(--to)}}
.taka{position:relative;z-index:2;font-size:54px;font-weight:700;color:#fff;line-height:1;text-shadow:0 4px 14px rgba(0,0,0,.25);animation:beat 2.4s 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* ঘূর্ণায়মান ছোট কয়েন */
.orbit{position:absolute;inset:-10px;animation:spin 6s linear infinite}
.orbit i{position:absolute;width:11px;height:11px;border-radius:50%}
.orbit i:nth-child(1){top:0;left:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.orbit i:nth-child(2){bottom:8px;left:12%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.orbit i:nth-child(3){bottom:8px;right:12%;background:var(--coral);box-shadow:0 0 12px var(--coral)}
@keyframes spin{to{transform:rotate(360deg)}}

h1{margin-top:30px;font-size:38px;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,#2338e8,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .5s ease-out both}
.tag{margin-top:6px;color:var(--mute);font-size:15px;font-weight:500;animation:up .8s .75s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.chips{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(40,56,110,.08);font-size:12.5px;font-weight:600;color:var(--ink);animation:up .7s both}
.chips span:nth-child(1){animation-delay:1.0s}.chips span:nth-child(2){animation-delay:1.15s}.chips span:nth-child(3){animation-delay:1.3s}
.chips b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* লোডিং বার */
.bar{margin-top:34px;width:min(220px,60vw);height:6px;border-radius:6px;background:rgba(51,71,255,.14);overflow:hidden;animation:up .6s 1.1s both}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--violet));animation:fill var(--dur) 0s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
.hint{margin-top:12px;font-size:12px;color:var(--mute);opacity:.85;animation:up .6s 1.4s both}

.foot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--mute);opacity:.7;z-index:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .ring{stroke-dashoffset:var(--to)!important}
}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<main class="wrap" id="splash" aria-label="আমার হিসাব লোড হচ্ছে">
  <div class="logo">
    <svg viewBox="0 0 132 132" aria-hidden="true">
      <circle class="ring-bg" cx="66" cy="66" r="56"/>
      <circle class="ring r1" cx="66" cy="66" r="56"/>
      <circle class="ring r2" cx="66" cy="66" r="56"/>
      <circle class="ring r3" cx="66" cy="66" r="56"/>
    </svg>
    <div class="tile"></div>
    <div class="taka">৳</div>
    <div class="orbit" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <h1>আমার হিসাব</h1>
  <p class="tag">আয়-ব্যয়ের সহজ হিসাব</p>

  <div class="chips" aria-hidden="true">
    <span><b style="background:var(--mint)"></b>আয়</span>
    <span><b style="background:var(--coral)"></b>ব্যয়</span>
    <span><b style="background:var(--blue)"></b>সঞ্চয় ও বিনিয়োগ</span>
  </div>

  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="hint">লোড হচ্ছে…</div>
</main>

<div class="foot"></div>

<script>
(function(){
  // home.html আপডেট করলে এই সংখ্যাটি বদলে দিন — ফোনে বা Android WebView-তে পুরোনো ক্যাশ আটকে থাকবে না
  var REV = '1';
  var DELAY = 3600; // মিলিসেকেন্ড (৩.৬ সেকেন্ড)

  var gone = false;
  function go(){
    if (gone) return; gone = true;
    var q = location.search ? location.search + '&v=' + REV : '?v=' + REV;
    location.replace('home.html' + q + location.hash);
  }
  var t = setTimeout(go, DELAY);
  document.getElementById('splash').addEventListener('click', function(){ clearTimeout(t); go(); });
  document.addEventListener('keydown', function(){ clearTimeout(t); go(); });
})();
</script>
</body>
</html>
