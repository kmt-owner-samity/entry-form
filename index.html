<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1030">
<title>আমার হিসাব</title>
<noscript><meta http-equiv="refresh" content="5;url=home.html"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Hind Siliguri','Segoe UI',sans-serif;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#241a6b 0%,#14104a 45%,#0a0c26 100%);display:grid;place-items:center;transition:opacity .5s ease,transform .5s ease}
body.out{opacity:0;transform:scale(1.04)}

/* floating glow blobs */
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 9s ease-in-out infinite}
.b1{width:340px;height:340px;background:#3347ff;top:-90px;left:-100px}
.b2{width:300px;height:300px;background:#8b5cf6;bottom:-80px;right:-90px;animation-delay:-3s}
.b3{width:220px;height:220px;background:#12b886;top:55%;left:-60px;opacity:.28;animation-delay:-6s}
.b4{width:200px;height:200px;background:#ff5c7a;top:12%;right:-50px;opacity:.28;animation-delay:-2s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-34px) scale(1.12)}}

/* growth line */
.chart{position:absolute;left:0;right:0;bottom:16%;width:100%;height:30%;opacity:.9}
.chart path.line{fill:none;stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s 1.2s cubic-bezier(.5,0,.2,1) forwards;filter:drop-shadow(0 0 8px rgba(99,102,241,.8))}
.chart path.area{fill:url(#a);opacity:0;animation:fade 1.2s 2.6s forwards}
.chart circle{fill:#fff;opacity:0;animation:fade .4s 3.5s forwards;filter:drop-shadow(0 0 8px #fff)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* center stage */
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.logo-wrap{position:relative;width:124px;height:124px;display:grid;place-items:center;margin-bottom:34px}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:0;border-radius:36px;border:2px solid rgba(139,120,255,.7);opacity:0;animation:ripple 2.6s 1s ease-out infinite}
.logo-wrap::after{animation-delay:1.9s}
@keyframes ripple{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.logo{position:relative;width:112px;height:112px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(135deg,#3347ff 0%,#6a4cf0 55%,#a47bff 100%);box-shadow:0 24px 70px rgba(99,102,241,.6),inset 0 1px 0 rgba(255,255,255,.35);animation:pop 1.1s cubic-bezier(.2,1.5,.4,1) both,bob 4s 1.2s ease-in-out infinite;overflow:hidden}
.logo::after{content:"";position:absolute;top:-60%;left:-60%;width:60%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:rotate(20deg);animation:shine 2.4s 1.6s ease-in-out infinite}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{0%{left:-60%}60%,100%{left:140%}}
.logo svg{width:54px;height:54px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo svg .d{stroke-dasharray:90;stroke-dashoffset:90;animation:draw 1.2s .6s ease forwards}
.logo svg .dot{fill:#fff;stroke:none;opacity:0;animation:fade .3s 1.6s forwards}

.title{font-size:clamp(38px,11vw,60px);font-weight:700;line-height:1.15;letter-spacing:-.5px}
.title span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(22px);background:linear-gradient(180deg,#fff 30%,#c9c3ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
.title span:nth-child(1){animation-delay:.9s}
.title span:nth-child(2){animation-delay:1.15s;margin-left:.25em}
@keyframes in{to{opacity:1;filter:blur(0);transform:none}}

.chips{display:flex;gap:10px;margin-top:28px;opacity:0;animation:up .8s 2.1s ease forwards}
.chip{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* progress + skip */
.loader{position:absolute;left:50%;bottom:max(36px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(240px,60vw);z-index:2;text-align:center}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#3347ff,#a47bff,#12b886);animation:fill 4.2s cubic-bezier(.4,0,.2,1) forwards;box-shadow:0 0 14px rgba(139,120,255,.9)}
@keyframes fill{to{width:100%}}
.skip{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;z-index:3;padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#d9d6ff;font:600 13px 'Hind Siliguri',sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s}
.skip:hover,.skip:focus-visible{background:rgba(255,255,255,.18);outline:none}

@media(prefers-reduced-motion:reduce){
  .blob,.logo,.logo::after,.logo-wrap::before,.logo-wrap::after{animation:none!important}
}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

  <svg class="chart" viewBox="0 0 400 160" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3347ff"/><stop offset=".6" stop-color="#a47bff"/><stop offset="1" stop-color="#12b886"/></linearGradient>
      <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4cf0" stop-opacity=".35"/><stop offset="1" stop-color="#6a4cf0" stop-opacity="0"/></linearGradient>
    </defs>
    <path class="area" d="M0 130 C40 120 60 140 100 110 S170 90 210 100 S280 50 320 55 S375 20 400 12 L400 160 L0 160Z"/>
    <path class="line" d="M0 130 C40 120 60 140 100 110 S170 90 210 100 S280 50 320 55 S375 20 400 12"/>
    <circle cx="396" cy="13" r="4"/>
  </svg>

  <button class="skip" onclick="go()">এড়িয়ে যান</button>

  <main class="stage">
    <div class="logo-wrap">
      <div class="logo">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="d" d="M8 14h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V14Z"/>
          <path class="d" d="M8 14l24-6a3 3 0 0 1 4 3v3"/>
          <path class="d" d="M40 26h-7a3.5 3.5 0 0 0 0 7h7"/>
          <circle class="dot" cx="33.5" cy="29.5" r="1.6"/>
        </svg>
      </div>
    </div>
    <h1 class="title"><span>আমার</span><span>হিসাব</span></h1>
    
    <div class="chips">
      <div class="chip"><i style="background:#12b886"></i>আয়</div>
      <div class="chip"><i style="background:#ff5c7a"></i>ব্যয়</div>
      <div class="chip"><i style="background:#a47bff"></i>সঞ্চয়</div>
    </div>
  </main>

  <div class="loader">
    <div class="bar"><i></i></div>
  </div>

<script>
    // রিডাইরেক্ট গন্তব্য ও সময়
    const TARGET = 'home.html'; // আপনার মূল পেজের নাম
    const SHOW_MS = 4200;   // অ্যানিমেশন চলার সময়
    const FADE_MS = 500;    // ফেড-আউট (মোট ≈ ৪.৭ সেকেন্ড)

    let done = false;
    function go() {
        if (done) return;
        done = true;
        document.body.classList.add('out');
        setTimeout(() => location.replace(TARGET), FADE_MS);
    }
    setTimeout(go, SHOW_MS);
</script>
</body>
</html>
